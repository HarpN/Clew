site_name: Clew - Personal AI Assistant Documentation
site_description: Documentation for Clew personal AI assistant - decoupled UI, real-time voice, mobile hub, and dual-database architecture.
site_author: Clew Team

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.expand
    - navigation.top
    - navigation.sections
    - content.code.copy

plugins:
  - search

nav:
  - Overview: index.md
  - System Architecture: architecture.md
  - Mobile Hub & API: mobile.md
  - Deployment & CI/CD: deployment.md
