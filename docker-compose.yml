services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clew-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clew
      POSTGRES_USER: clew_user
      POSTGRES_PASSWORD: clew_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/v2_postgres_migration.sql:/docker-entrypoint-initdb.d/v2_postgres_migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clew_user -d clew"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: clew-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-bootstrap:
    image: curlimages/curl:latest
    container_name: clew-ollama-bootstrap
    depends_on:
      - ollama
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama service at http://ollama:11434..."
        until curl -s http://ollama:11434/api/tags > /dev/null; do
          sleep 2
        done
        echo "Ollama API is ready. Pulling llama3 model..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "llama3"}'
        echo "Model pull command dispatched successfully!"
        exit 0

  clew-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clew-ui
    restart: always
    ports:
      - "8502:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clew
      POSTGRES_USER: clew_user
      POSTGRES_PASSWORD: clew_secret
      POSTGRES_PORT: "5432"
      OLLAMA_HOST: http://ollama:11434/v1
      LOCAL_MODEL: llama3
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    command: streamlit run ui/app.py --server.port=8501 --server.address=0.0.0.0

  clew-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clew-mobile
    restart: always
    ports:
      - "8008:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clew
      POSTGRES_USER: clew_user
      POSTGRES_PASSWORD: clew_secret
      POSTGRES_PORT: "5432"
      OLLAMA_HOST: http://ollama:11434/v1
      LOCAL_MODEL: llama3
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn mobile_server:app --host 0.0.0.0 --port 8000

  clew-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clew-agent
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clew
      POSTGRES_USER: clew_user
      POSTGRES_PASSWORD: clew_secret
      POSTGRES_PORT: "5432"
      OLLAMA_HOST: http://ollama:11434/v1
      LOCAL_MODEL: llama3
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: python agent.py dev

volumes:
  postgres_data:
  ollama_data:
