apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: clew
type: Opaque
stringData:
  # OpenAI Core API Key
  OPENAI_API_KEY: {{ .Values.agent.env.OPENAI_API_KEY | default "sk-placeholder-key" | quote }}
  # LiveKit WebRTC Session Sync Credentials
  LIVEKIT_API_KEY: {{ .Values.agent.env.LIVEKIT_API_KEY | default "dev_key" | quote }}
  LIVEKIT_API_SECRET: {{ .Values.agent.env.LIVEKIT_API_SECRET | default "dev_secret" | quote }}
  # PostgreSQL Credentials (for V2 Pivot)
  POSTGRES_DB: {{ .Values.postgresql.auth.database | default "clew_v2" | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | default "clew_admin" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | default "clew_secure_pass" | quote }}
