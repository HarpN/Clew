name: Clew
options:
  bundleIdPrefix: com.clew
  xcodeVersion: "15.0"
targets:
  Clew:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Clew/App
      - path: Clew/Models
      - path: Clew/Services
      - path: Clew/ViewModels
      - path: Clew/Views
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Clew requires microphone access for sub-500ms WebRTC voice sessions."
    dependencies:
      - package: LiveKit
      - package: GRDB
  ClewTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources: [ClewTests]
    dependencies:
      - target: Clew
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.0.0
